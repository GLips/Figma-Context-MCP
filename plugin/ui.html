<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Colors come from Figma's themeColors variables (showUI themeColors:true) so an ALWAYS-ON
         window follows the editor's light/dark theme instead of glaring white over a dark canvas.
         Every var() carries a light-theme fallback, so a renamed/absent variable degrades to the
         old palette rather than to unreadable defaults. */
      :root {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }
      body {
        margin: 0;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      /* The resting state: one line, always visible. A real <button> (reset to look like a bar), not
         a clickable div — this is the plugin's primary control, so it has to be focusable and
         keyboard-operable, and the whole bar is the hit area: a big target beats a 12px chevron.
         Hover/active wash with currentColor rather than a fixed tint, so ONE rule reads correctly in
         both themes (dark text darkens the light theme; light text lightens the dark one). */
      #strip {
        display: flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        user-select: none;
      }
      #strip:hover {
        background: color-mix(in srgb, currentColor 6%, transparent);
      }
      #strip:active {
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      :focus-visible {
        outline: 2px solid var(--figma-color-border-selected, #0d99ff);
        outline-offset: -2px;
      }
      #dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-border, #ccc);
      }
      #dot.live {
        background: var(--figma-color-icon-success, #1a7f37);
      }
      #dot.wants {
        background: var(--figma-color-icon-warning, #d19d00);
      }
      #dot.ready {
        background: var(--figma-color-text-secondary, #888);
      }
      #status {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* ONE glyph for both states, rotated — swapping ⌄ for ⌃ swaps the optical weight and baseline
         too, so the mark visibly jumps every toggle. */
      #chevron {
        flex: none;
        font-size: 9px;
        color: var(--figma-color-text-secondary, #888);
        transition: transform 120ms ease;
      }
      #chevron.up {
        transform: rotate(180deg);
      }
      /* Collapsed ⇒ render() sets display:none EXPLICITLY, rather than relying on
         `#detail:empty { display: none }` to infer it from an emptied node. The measured height is
         load-bearing here, so the thing that removes this block from layout should be stated, not
         derived from a selector that silently stops matching if a stray text node ever lands here. */
      #detail {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        border-top: 1px solid var(--figma-color-border, #e5e5e5);
      }
      .orientation {
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border-radius: 6px;
        padding: 12px;
        line-height: 1.45;
        color: var(--figma-color-text-secondary, #555);
      }
      .orientation-title {
        font-weight: 600;
        color: var(--figma-color-text, #1e1e1e);
        padding-bottom: 4px;
      }
      .empty {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        color: var(--figma-color-text-secondary, #888);
        line-height: 1.45;
      }
      .empty-link {
        color: var(--figma-color-text-brand, #0d99ff);
      }
      /* Two gaps, not one: the text lines are a group (4px) and the actions row is separate (8px).
         A single uniform gap makes the row read as four unrelated lines. */
      .session {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: 6px;
        padding: 12px;
      }
      .session-lines {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .session-id {
        font-weight: 500;
        word-break: break-all;
      }
      .session-code {
        color: var(--figma-color-text-secondary, #777);
        font-variant-numeric: tabular-nums;
      }
      .status-line {
        color: var(--figma-color-text-secondary, #555);
      }
      .status-line.driving {
        color: var(--figma-color-icon-success, #1a7f37);
        font-weight: 500;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      #detail button {
        flex: 1;
        border: none;
        border-radius: 6px;
        padding: 8px 0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      /* A lone action (Revoke access) is a SECONDARY control — stretched to the full card width it
         reads as the row's primary one. Only a paired Allow/Deny splits the width. */
      #detail button:only-child {
        flex: 0 0 auto;
        padding: 8px 12px;
      }
      /* Same currentColor wash as the strip: on the brand button currentColor is white (lightens the
         blue), on the secondary it's the text color (darkens in light theme, lightens in dark). */
      #detail button:hover {
        box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 10%, transparent);
      }
      #detail button:active {
        box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 18%, transparent);
      }
      #detail button.allow {
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #fff);
      }
      #detail button.deny {
        background: var(--figma-color-bg-secondary, #f0f0f0);
        color: var(--figma-color-text, #333);
      }
    </style>
  </head>
  <body>
    <!-- Everything lives in #root, and #root is what gets measured. The BODY cannot be measured:
         Figma's injected page styles stretch it to the window, so it never reports a height smaller
         than the current window — collapse would measure the old expanded size and ask for exactly
         the size it already had. A plain in-flow div is content-height, so it can shrink. -->
    <div id="root">
      <button id="strip" type="button" aria-expanded="false">
        <span id="dot"></span>
        <span id="status">Waiting for a session…</span>
        <span id="chevron">▾</span>
      </button>
      <div id="detail" style="display: none"></div>
    </div>
    <script>
      // The plugin's ONLY network context (the sandbox code.js has no WS access), so this iframe
      // relays server↔sandbox traffic unmodified:
      //   server  --WS-->            here  --parent.postMessage-->  code.js
      //   code.js --figma.ui.postMessage-->  here  --WS-->          server
      //
      // It is ALSO the plugin's only human surface: an always-visible status strip that expands into
      // the session list. The sandbox drives it with one local RENDER control message (NOT relayed to
      // the WS) and owns every decision (sole arbiter); this file only reports clicks (UI_DECISION /
      // UI_REVOKE / UI_TOGGLE) and its own measured height (UI_HEIGHT). Resizing does not reload the
      // iframe, so the WS connections below survive every expand/collapse.
      //
      // Opens ONE persistent connection per port in the block from bridge/src/config.ts
      // (WS_PORT_BLOCK). Each running server probe-binds one block port, so scanning the whole block
      // discovers every live session at once (Slice 3.2). The persistent relay does double duty:
      // discovery AND disconnect-detection (onclose ⇒ the session's row leaves the panel) — one
      // mechanism, not a separate poll. This list MUST mirror config's WS_PORT_BLOCK and the
      // manifest's networkAccess.devAllowedDomains (the contract harness pins the mirror). We dial
      // `localhost`, not the 127.0.0.1 literal, because Figma's manifest validator rejects raw IP
      // addresses in devAllowedDomains ("must be a valid URL") — and the allowlist host has to match
      // the host we dial. The server binds IPv4 loopback (127.0.0.1) only; `localhost` can resolve to
      // IPv6 `::1` first, but a refused `::1` connect on loopback returns instantly, so Chromium
      // (Figma's runtime) falls back to 127.0.0.1 with no perceptible delay. Both are loopback, so the
      // loopback-only boundary still holds. (Don't "fix" this back to 127.0.0.1 — the manifest can't.)
      var WS_PORT_BLOCK = [
        9876, 9877, 9878, 9879, 9880, 9881, 9882, 9883,
        9884, 9885, 9886, 9887, 9888, 9889, 9890, 9891,
      ];
      // Every live socket, keyed by its port — the local-only connection key (__connKey) the sandbox
      // threads through replies so each one goes back out on the socket it arrived on.
      var sockets = {};

      // Reconnect cadence, per port. A port that has NEVER opened is almost certainly empty (no server
      // in the block bound it), so we back its retries off 1s → 15s. This is purely to tame console
      // noise: every doomed connect emits a browser-level "WebSocket connection to … failed" line that
      // Chromium logs from its network stack — NOT through console.*, so JS cannot catch or mute it. The
      // initial scan still bursts ~14 failures once at load; backoff turns the *ongoing* flood into one
      // blip per empty port every ~15s. A port that has opened (a real session) stays on the fast 1s
      // cadence so a dropped/restarted server reappears in the panel promptly. Late discovery still
      // works — a server that binds a long-idle port is found within the cap.
      var BASE_RECONNECT_MS = 1000;
      var MAX_RECONNECT_MS = 15000;
      var reconnectDelays = {};

      function connect(port) {
        var ws = new WebSocket("ws://localhost:" + port);
        sockets[port] = ws;
        // Did THIS socket ever open? Most block ports have no server, so their connect fails and fires
        // onclose without ever opening. We must NOT tell the sandbox about those dead ports — a
        // WS_CONNECTED/WS_CLOSED per failed retry (~once/sec × ~14 empty ports) would storm the panel's
        // render/visibility. Only a socket that actually opened represents a real session.
        var opened = false;
        ws.onopen = function () {
          opened = true;
          // A real server lives here — keep this port on the fast cadence so it rediscovers quickly if
          // the server drops/restarts.
          reconnectDelays[port] = BASE_RECONNECT_MS;
          // Tell the sandbox a FRESH connection opened on THIS port so it drops any binding from the
          // previous socket on it. A different local server can grab a freed port; without this reset
          // a write arriving before that server's SESSION_INFO would ride the prior (approved) binding
          // into the executor — the consent gate's job is to stop exactly that. Tagged with __connKey
          // so the sandbox resets the right session. onopen fires before any onmessage on this socket,
          // so the reset lands before the new server's first message. Carries no id: local control.
          parent.postMessage({ pluginMessage: { type: "WS_CONNECTED", __connKey: port } }, "*");
        };
        ws.onmessage = function (event) {
          // Server → sandbox. Tag the message with its source port (__connKey) so the sandbox keys
          // its per-connection map and routes the reply back to this socket. __connKey is LOCAL — it
          // is stripped again before any sandbox reply re-enters the WS (see window.onmessage).
          var msg = JSON.parse(event.data);
          msg.__connKey = port;
          parent.postMessage({ pluginMessage: msg }, "*");
        };
        ws.onclose = function () {
          // Tell the sandbox a real session dropped so its row leaves the panel (disconnect-detection
          // reuses this persistent relay) — but ONLY if this socket had opened; a dead port that never
          // connected has no row to remove and must stay silent. Either way, auto-reconnect: the plugin
          // outlives any single server run, and an empty port keeps its slot warm for a server that may
          // yet bind it (discovery is the same persistent relay).
          if (opened) {
            parent.postMessage({ pluginMessage: { type: "WS_CLOSED", __connKey: port } }, "*");
          } else {
            // Never opened ⇒ presumed-empty port: double the backoff (capped) so its doomed retries —
            // and the un-mutable console line each one emits — slow to a trickle instead of 1/sec.
            var prev = reconnectDelays[port] || BASE_RECONNECT_MS;
            reconnectDelays[port] = Math.min(prev * 2, MAX_RECONNECT_MS);
          }
          setTimeout(function () {
            connect(port);
          }, reconnectDelays[port] || BASE_RECONNECT_MS);
        };
      }

      // Sandbox → server relay, EXCEPT local control messages (RENDER, and the panel-control
      // SHOW/HIDE verbs it replaced), which the sandbox addresses to THIS iframe, not a server.
      // Everything else carries __connKey — the port whose socket it must go out on (a reply, or the
      // SESSION_TOKEN Allow handover). Strip __connKey before ws.send so this LOCAL routing key never
      // rides onto the frozen envelope.
      window.onmessage = function (event) {
        var msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "RENDER") {
          render(msg);
          return;
        }
        var port = msg.__connKey;
        delete msg.__connKey;
        var ws = sockets[port];
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(msg));
        }
      };

      // Allow / Deny → the sandbox (sole arbiter), tagged with the row's connection key so the
      // sandbox routes the decision to the right session. The button carries NO approval logic: it
      // just reports the human's choice; the sandbox mints the token (Slice 2.1b / 3.2).
      function decide(approve, key) {
        parent.postMessage({ pluginMessage: { type: "UI_DECISION", approve: approve, __connKey: key } }, "*");
      }

      document.getElementById("strip").onclick = function () {
        parent.postMessage({ pluginMessage: { type: "UI_TOGGLE" } }, "*");
      };

      // Render the whole surface from one RENDER payload: the always-on strip, plus — when expanded —
      // the session list. Built with textContent, never innerHTML, so a project path can't inject
      // markup.
      function render(msg) {
        var sessions = msg.sessions || [];
        renderStrip(sessions, msg.expanded);

        var detail = document.getElementById("detail");
        detail.textContent = "";
        detail.style.display = msg.expanded ? "flex" : "none";
        if (msg.expanded) {
          if (msg.showOrientation) detail.appendChild(orientationBanner());
          if (!sessions.length) detail.appendChild(emptyState());
          sessions.forEach(function (s) {
            detail.appendChild(sessionCard(s));
          });
        }
        reportHeight();
      }

      // One glanceable line, in priority order: a decision you owe > who is driving > who is ready.
      // Pending approval is what the human must act on, so it outranks everything else.
      function renderStrip(sessions, expanded) {
        var wants = 0;
        var approved = 0;
        var active = null;
        sessions.forEach(function (s) {
          if (!s.approved) wants++;
          else approved++;
          if (s.active) active = s;
        });

        var text;
        var tone;
        if (wants) {
          text = wants === 1 ? "A session wants to connect" : wants + " sessions want to connect";
          tone = "wants";
        } else if (active) {
          text = active.label + " — driving";
          tone = "live";
        } else if (approved === 1) {
          text = approvedLabel(sessions) + " — ready";
          tone = "ready";
        } else if (approved) {
          text = approved + " sessions ready";
          tone = "ready";
        } else {
          text = "Waiting for a session…";
          tone = "";
        }

        document.getElementById("dot").className = tone;
        document.getElementById("status").textContent = text;
        document.getElementById("chevron").className = expanded ? "up" : "";
        document.getElementById("strip").setAttribute("aria-expanded", expanded ? "true" : "false");
      }

      function approvedLabel(sessions) {
        for (var i = 0; i < sessions.length; i++) {
          if (sessions[i].approved) return sessions[i].label;
        }
        return "A session";
      }

      // Shown once, ever. It carries the one thing the buttons can't: what Allow actually costs.
      // Everything else a first-timer might wonder (who's driving, when it changed hands) is
      // answered where it happens — the strip and the takeover toast — not pre-explained here.
      function orientationBanner() {
        var intro = el("div", "orientation");
        intro.appendChild(
          el("div", "orientation-title", "Framelink connects an AI agent to this file."),
        );
        intro.appendChild(
          el(
            "div",
            null,
            "Approving a session lets it run code against this document — only approve sessions " +
              "you started.",
          ),
        );
        return intro;
      }

      // Someone can land here having never heard of Framelink — a teammate who opened a plugin they
      // found in the file, or a first run before any server exists. So the empty state carries the
      // one link out. An <a target="_blank"> is the supported way to leave the plugin: window.open
      // works only from this iframe, never from the sandbox, and navigation isn't governed by the
      // manifest's networkAccess (which covers requests).
      function emptyState() {
        var wrap = el("div", "empty");
        wrap.appendChild(
          el(
            "div",
            null,
            "No sessions yet. Start the Framelink MCP server in your project and it'll appear here.",
          ),
        );
        var link = el("a", "empty-link", "What is Framelink?");
        link.href = "https://framelink.ai";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        wrap.appendChild(link);
        return wrap;
      }

      // A row per live session: what it is, the pairing code to glance-compare against the agent's
      // message, its state, and the one control that state offers.
      function sessionCard(s) {
        var card = el("div", "session");
        var lines = el("div", "session-lines");
        lines.appendChild(el("div", "session-id", s.identity || "(unknown project)"));
        lines.appendChild(el("div", "session-code", "Pairing code " + (s.pairingCode || "—")));
        card.appendChild(lines);

        var actions = el("div", "actions");
        if (!s.approved) {
          // No "waiting for your approval" line — Allow and Deny sitting there already say it.
          var allow = el("button", "allow", "Allow");
          allow.onclick = function () {
            decide(true, s.key);
          };
          var deny = el("button", "deny", "Deny");
          deny.onclick = function () {
            decide(false, s.key);
          };
          actions.appendChild(allow);
          actions.appendChild(deny);
        } else {
          lines.appendChild(
            el(
              "div",
              s.active ? "status-line driving" : "status-line",
              s.active ? "● Driving this file" : "Approved — ready to drive",
            ),
          );
          // Revoke, not disconnect — the socket and the row both stay. What goes away is this
          // session's PERMISSION (here and in the server's persisted token), so its next write asks
          // again.
          var revoke = el("button", "deny", "Revoke access");
          revoke.onclick = function () {
            parent.postMessage({ pluginMessage: { type: "UI_REVOKE", __connKey: s.key } }, "*");
          };
          actions.appendChild(revoke);
        }
        card.appendChild(actions);
        return card;
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      // The window is sized from what this document actually measures, so the sandbox never has to
      // guess a height per state (and the strip stays exactly one line tall when collapsed).
      //
      // Reported on EVERY render, never deduped against the last reported value. This document
      // cannot observe whether a resize was actually honored — Figma drops some of them (see
      // resizeWindow in code.ts) — so a "we already asked for 220" cache silently wedges the window
      // at whatever size it really has: collapse reports 40, the resize is dropped, and the next
      // expand measures 220, matches the cache, and sends nothing. A redundant resize costs nothing;
      // a suppressed one strands the window.
      // Measured inside rAF — after the browser has laid the new DOM out, rather than forcing a
      // synchronous reflow the instant we mutate it.
      function reportHeight() {
        // Measured inside rAF — after the browser has laid the new DOM out, rather than forcing a
        // synchronous reflow the instant we mutate it. #root, never document.body: see the note on
        // the element itself. This is why the window can shrink at all.
        requestAnimationFrame(function () {
          var height = document.getElementById("root").offsetHeight;
          parent.postMessage({ pluginMessage: { type: "UI_HEIGHT", height: height } }, "*");
        });
      }

      // The sandbox can't render into an iframe that hasn't loaded, so this document asks for its
      // first paint rather than the sandbox firing one into the void at startup.
      parent.postMessage({ pluginMessage: { type: "UI_READY" } }, "*");
      WS_PORT_BLOCK.forEach(connect);
    </script>
  </body>
</html>
