<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Colors come from Figma's themeColors variables (showUI themeColors:true) so an ALWAYS-ON
         window follows the editor's light/dark theme instead of glaring white over a dark canvas.
         Every var() carries a light-theme fallback, so a renamed/absent variable degrades to the
         old palette rather than to unreadable defaults. */
      :root {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }
      body {
        margin: 0;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      /* The resting state: one line, always visible. A real <button> (reset to look like a bar), not
         a clickable div — this is the plugin's primary control, so it has to be focusable and
         keyboard-operable, and the whole bar is the hit area: a big target beats a 12px chevron.
         Hover/active wash with currentColor rather than a fixed tint, so ONE rule reads correctly in
         both themes (dark text darkens the light theme; light text lightens the dark one). */
      #strip {
        display: flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        user-select: none;
      }
      #strip:hover {
        background: color-mix(in srgb, currentColor 6%, transparent);
      }
      #strip:active {
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      :focus-visible {
        outline: 2px solid var(--figma-color-border-selected, #0d99ff);
        outline-offset: -2px;
      }
      #dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-border, #ccc);
      }
      #dot.live {
        background: var(--figma-color-icon-success, #1a7f37);
      }
      #dot.wants {
        background: var(--figma-color-icon-warning, #d19d00);
      }
      #dot.ready {
        background: var(--figma-color-text-secondary, #888);
      }
      #status {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* ONE glyph for both states, rotated — swapping ⌄ for ⌃ swaps the optical weight and baseline
         too, so the mark visibly jumps every toggle. */
      #chevron {
        flex: none;
        font-size: 9px;
        color: var(--figma-color-text-secondary, #888);
        transition: transform 120ms ease;
      }
      #chevron.up {
        transform: rotate(180deg);
      }
      /* Collapsed ⇒ render() sets display:none EXPLICITLY, rather than relying on
         `#detail:empty { display: none }` to infer it from an emptied node. The measured height is
         load-bearing here, so the thing that removes this block from layout should be stated, not
         derived from a selector that silently stops matching if a stray text node ever lands here. */
      #detail {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        border-top: 1px solid var(--figma-color-border, #e5e5e5);
      }
      .orientation {
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border-radius: 6px;
        padding: 12px;
        line-height: 1.45;
        color: var(--figma-color-text-secondary, #555);
      }
      .orientation-title {
        font-weight: 600;
        color: var(--figma-color-text, #1e1e1e);
        padding-bottom: 4px;
      }
      .empty {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        color: var(--figma-color-text-secondary, #888);
        line-height: 1.45;
      }
      .empty-link {
        color: var(--figma-color-text-brand, #0d99ff);
      }
      /* Two gaps, not one: the text lines are a group (4px) and the actions row is separate (8px).
         A single uniform gap makes the row read as four unrelated lines. */
      .session {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: 6px;
        padding: 12px;
      }
      /* A call waiting on the human reads as live. */
      .session.waiting {
        border-color: var(--figma-color-border-brand, #0d99ff);
      }
      .session-lines {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .session-id {
        font-weight: 500;
        word-break: break-all;
      }
      .status-line {
        color: var(--figma-color-text-secondary, #555);
      }
      .status-line.driving {
        color: var(--figma-color-icon-success, #1a7f37);
        font-weight: 500;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      #detail button {
        flex: 1;
        border: none;
        border-radius: 6px;
        padding: 8px 0;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      /* A lone action (Revoke) is a SECONDARY control — stretched to the full card width it
         reads as the row's primary one. Only a paired Allow/Deny splits the width. */
      #detail button:only-child {
        flex: 0 0 auto;
        padding: 8px 12px;
      }
      /* Same currentColor wash as the strip: on the brand button currentColor is white (lightens the
         blue), on the secondary it's the text color (darkens in light theme, lightens in dark). */
      #detail button:hover {
        box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 10%, transparent);
      }
      #detail button:active {
        box-shadow: inset 0 0 0 999px color-mix(in srgb, currentColor 18%, transparent);
      }
      #detail button.allow {
        background: var(--figma-color-bg-brand, #0d99ff);
        color: var(--figma-color-text-onbrand, #fff);
      }
      #detail button.deny {
        background: var(--figma-color-bg-secondary, #f0f0f0);
        color: var(--figma-color-text, #333);
      }
      /* Write access (free allowance, Framelink sign-in) — inside the session card it concerns, set
         apart like the orientation block because it is information first and a control second. */
      .write-access {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border-radius: 6px;
        padding: 12px;
        line-height: 1.45;
        color: var(--figma-color-text-secondary, #555);
      }
      .write-access-title {
        font-weight: 600;
        color: var(--figma-color-text, #1e1e1e);
      }
      .write-access-code,
      .pairing-code {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
        color: var(--figma-color-text, #1e1e1e);
      }
      .link-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        background: var(--figma-color-bg, #fff);
        color: var(--figma-color-text, #1e1e1e);
      }
    </style>
  </head>
  <body>
    <!-- Everything lives in #root, and #root is what gets measured. The BODY cannot be measured:
         Figma's injected page styles stretch it to the window, so it never reports a height smaller
         than the current window — collapse would measure the old expanded size and ask for exactly
         the size it already had. A plain in-flow div is content-height, so it can shrink. -->
    <div id="root">
      <button id="strip" type="button" aria-expanded="false">
        <span id="dot"></span>
        <span id="status">Waiting for a session…</span>
        <span id="chevron">▾</span>
      </button>
      <div id="detail" style="display: none"></div>
    </div>
    <script>/* UI_SCRIPT: build.mjs inlines the ui.ts bundle here */</script>
  </body>
</html>
