name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # One gate over the whole workspace: hidden-char scan, format, lint, and
      # type-check + test for figma-mcp's core, plus the relocated flcm surface
      # (plugin typecheck/build with the zod-purity guard, bridge typecheck,
      # preamble/bridge tests, the WS-envelope + port-mirror contract harness,
      # and the generated-doc drift check). A core change
      # that alters output fails the goldens + parity snapshots here.
      - name: Validate
        run: pnpm validate
