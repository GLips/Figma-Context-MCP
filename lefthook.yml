pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,js,json,md}"
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    lint:
      glob: "*.{ts,js}"
      # --no-warn-ignored: staged plugin/ & bridge/ files are eslint-ignored (the
      # flcm surface keeps its own toolchain); without this, passing them
      # explicitly spews a "File ignored" warning per file on every commit.
      run: pnpm eslint --no-warn-ignored {staged_files}
    type-check:
      glob: "*.{ts,js}"
      run: pnpm type-check
    scan-hidden-chars:
      glob: "*.{ts,js,mjs,cjs,json,md,yml,yaml}"
      run: node scripts/scan-hidden-chars.mjs {staged_files}
